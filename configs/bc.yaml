# Behavior cloning defaults (full Linux runs). The Mac smoke overrides steps,
# batch size, and demo paths — see Makefile 'smoke' target.
task: pick_cube_arm
demos: []               # empty -> discover data/demos/{emb}/{env_id}/*.h5
out_dir: null           # default: data/checkpoints/bc_{task}_seed{seed}
vision: nature_cnn      # nature_cnn | resnet18
steps: 50000
batch_size: 256
lr: 3.0e-4
val_fraction: 0.1
eval_every: 500
log_every: 50
augment: true           # DrQ random-shift on images
paraphrase_augment: true
paraphrase_p: 0.7
preload: false
num_workers: 4
device: auto            # auto -> cuda | mps | cpu
