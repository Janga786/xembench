# PRESET: the full benchmark grid — B5. Produces the paper tables.
# Consumer: python -m xembench.scripts.evaluate --config configs/presets/full_eval_matrix.yaml
# Machine:  Linux recommended (sequential episodes; hours). Mac-compatible but slow.
# Prereq:   BC checkpoints for all tasks (B3); PPO cells fill in automatically
#           once B4 checkpoints exist (optional: true skips missing ones).
csv: data/results/eval.csv
episodes_csv: data/results/eval_episodes.csv
episodes_native: 100
episodes_transfer: 50
seeds: [0, 1, 2]        # 3 seeds for headline cells (plan B5)
vision: nature_cnn
device: auto
transfer: true
instruction_conds: [canonical, heldout]
color_conds: [train, unseen]      # Lang envs only; stock scenes report 'fixed'
tasks: [pick_cube_arm, stack_cube_arm, push_t_arm, pull_tool_arm,
        apple_bowl_g1, transport_box_g1]
policies:
  - type: bc
    ckpt: data/checkpoints/bc_{task}_seed{seed}/best.pt
  - type: bc_ppo
    ckpt: data/checkpoints/ppo_{task}_seed{seed}/best.pt
    optional: true
