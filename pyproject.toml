[project]
name = "xembench"
version = "0.2.0"
description = "X-Embodiment Language-Grounded Manipulation Benchmark: measuring language-conditioned policy transfer between a Franka Panda arm and a Unitree G1 humanoid upper body in ManiSkill3."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mani-skill>=3.0.1",
    "torch>=2.7",
    "torchvision>=0.22",
    "h5py>=3.10",
    "gymnasium>=0.29.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "tensorboard>=2.16",
    "imageio[ffmpeg]>=2.34",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xembench"]

# RTX 5090 (Blackwell, sm_120) needs cu128 builds; macOS uses default PyPI (MPS) wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
markers = ["sim: tests that create real ManiSkill environments (slow)"]
addopts = "-m 'not sim'"
testpaths = ["tests"]
